name: CI-CD for backend project group6

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  test: 
    runs-on:
      - ubuntu-latest
    defaults:
      run: 
        working-directory: backend-hotel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Performing clean installation
        run: npm ci
      - name: Checking composec config of container
        run: |
          cp example.env .env
          cp docker.example.env docker.env
          docker compose --env-file docker.env -f compose.yml -f compose.local.yml config --quiet

  integration: 
    needs:
      - test
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@7
      - name: Compose "production" version and start it
        run: |
          cp docker.env.example docker.env
          docker compose --env-file docker.env -f compose.yml -f compose.local.yml up -d --build --wait
      # - name: Smoke on the water
      - name: Performing Service & Integration & e2e test
        run: |
            npm tun test
            npm run test:e2e
      - name: Show if something failed
        if: failure()
        run: docker compose --env-file docker.env -f compose.yml -f compose.local.yml logs app db redis
      - name: Stop and delete this "testing"
        if: always()
        run:  docker compose --env-file docker.env -f compose.yml -f compose.local.yml down -v

  publish:
    needs:
      - integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-lastest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: NICKNAME="backend-project"
      - name: Build and Push the project image into ${NICKNAME}/<owner>/<repo>:<short sha> :main
        run: |
          IMAGE="${NICKNAME}/${GITHUB_REPOSITORY,,}"
          SHORT="${GITHUB_SHA::7}"
          docker compose --env-file docker.env -f compose.yml -f compose.production.yml -f compose.publish.yml build
          docker push "$IMAGE:$SHORT"
          docker tag "$IMAGE:$SHORT" "$IMAGE:main"
          docker push "$IMAGE:main"
          echo "Pushed $IMAGE:$SHORT" >> "$GITHUB_STEP_SUMMARY"


